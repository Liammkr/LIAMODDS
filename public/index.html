  <body>
    <div id="root"></div>

    <div class="overlay" id="overlay" style="display: none">
      <div class="overlay-content">
        <button
          id="sign"
          class="close-btn2"
          onclick="document.getElementById('overlay').style.display = 'none'"
        >
          &times;
        </button>
        <img src="images/LIAMODDSWHITE.png" alt="logo" class="liamodds" />
        <h2 style="color: white">Sign in</h2>
        <input class="idk" type="email" id="email" placeholder="Email" />
        <br />
        <input
          class="idk"
          type="password"
          id="password"
          placeholder="Password"
        />
        <br />
        <div style="width: 100%; text-align: left">
          <button class="mainbutton" id="log-in">Login</button>
          <a
            onclick="document.getElementById('overlay').style.display = 'none';document.getElementById('overlay2').style.display = 'flex';"
            style="
              text-align: left;
              width: fit-content;
              color: #4286f4;
              text-decoration: underline;
            "
            >Create Account</a
          >
        </div>
        <a
          onclick="document.getElementById('overlay').style.display = 'none';document.getElementById('overlay3').style.display = 'flex';"
          style="
            margin-top: 10px;
            text-align: center;
            width: fit-content;
            color: #4286f4;
            text-decoration: underline;
          "
          >Forgot Password?</a
        >
        <button class="google" id="google-sign-in">
          <img src="images/google.png" />Sign in with Google
        </button>
      </div>
    </div>

    <div class="overlay" id="overlay3" style="display: none">
      <div class="overlay-content2">
        <button
          id="sign"
          class="close-btn3"
          onclick="document.getElementById('overlay3').style.display = 'none'"
        >
          &times;
        </button>
        <img src="images/LIAMODDSWHITE.png" alt="logo" class="liamodds" />
        <h2 style="color: white">Forgot Password</h2>
        <input class="idk" type="email" id="reset-email" placeholder="Email" />
        <br />
        <div style="width: 100%; text-align: left">
          <button class="mainbutton" id="reset-password">Reset Password</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay2" style="display: none">
      <div class="overlay-content">
        <button
          id="sign"
          class="close-btn2"
          onclick="document.getElementById('overlay2').style.display = 'none'"
        >
          &times;
        </button>
        <img src="images/LIAMODDSWHITE.png" alt="logo" class="liamodds" />
        <h2 style="color: white">Create account</h2>
        <input class="idk" type="email" id="email2" placeholder="Email" />
        <br />
        <input
          class="idk"
          type="password"
          id="password2"
          placeholder="Password"
        />
        <br />
        <div style="width: 100%; text-align: left">
          <button class="mainbutton" id="sign-up">Sign Up</button>
          <a
            onclick="document.getElementById('overlay2').style.display = 'none'; document.getElementById('overlay').style.display = 'flex'"
            style="
              text-align: left;
              width: fit-content;
              color: #4286f4;
              text-decoration: underline;
            "
            >Login</a
          >
        </div>
        <button class="google" id="google-sign-in2">
          <img src="images/google.png" />Sign in with Google
        </button>
      </div>
    </div>

    <div>
      <div class="container2">
        <img
          src="https://raw.githubusercontent.com/Liammkr/WSTBET/main/LIAMODDSWHITE.png"
          alt="Your Image"
          class="img2"
        />
      </div>
      <button
        onclick="document.getElementById('overlay').style.display = 'flex'"
        onmouseover="this.style.backgroundColor='#555555'"
        onmouseout="this.style.backgroundColor='rgb(99, 102, 241)'"
        id="in"
        class="in"
      >
        Sign In
      </button>
      <button
        onclick="document.getElementById('overlay2').style.display = 'flex'"
        id="up"
        class="up"
      >
        Sign Up
      </button>
      <div>
        <button id="info" class="info2">error</button>

        <button
          class="out"
          id="out"
          onclick="  const logoutElement = document.getElementById('logout');
  const accountInfoElement = document.getElementById('accountinfo');
  
  if (logoutElement.style.display === 'none' || logoutElement.style.display === '') {
    logoutElement.style.display = 'inline-block';
    accountInfoElement.style.display = 'inline-block';
  } else {
    logoutElement.style.display = 'none';
    accountInfoElement.style.display = 'none';
  }"
        ></button>
        <button
          class="account"
          id="accountinfo"
          onmouseover="this.style.backgroundColor='#555555'"
          onmouseout="this.style.backgroundColor='rgb(99, 102, 241)'"
        >
          Account
        </button>
        <button
          class="account2"
          id="logout"
          onclick="   document.getElementById('logout').style.display = 'none'
            document.getElementById('accountinfo').style.display = 'none'"
          onmouseover="this.style.backgroundColor='#555555'"
          onmouseout="this.style.backgroundColor='rgb(99, 102, 241)'"
        >
          Log Out
        </button>
      </div>
    </div>
    <div class="container3">
      <label for="sportSelect"></label>
      <select id="sportSelect" style="display: none">
        <option value="basketball_nba" selected>NBA</option>
        <option value="baseball_mlb">MLB</option>
        <option value="icehockey_nhl">NHL</option>
        <option value="basketball_wnba">WNBA</option>
        <option value="americanfootball_nfl">NFL</option>
        <option value="best_sprt">Paid</option>
      </select>
      <label for="bookmakerSelect"></label>
      <select id="bookmakerSelect" style="display: none">
        <option value="draftkings" selected>DraftKings</option>
        <option value="fanduel">FanDuel</option>
      </select>
      <button id="best" class="tree" onclick="changesprt('best_sprt')">
        <img src="images/New.png" />
      </button>
      <button id="nba" class="tree" onclick="changesprt('basketball_nba')">
        <img src="images/NBA.png" />
      </button>
      <button id="mlb" class="tree" onclick="changesprt('baseball_mlb')">
        <img src="images/MLB.png" />
      </button>
      <button
        id="nfl"
        class="tree"
        onclick="changesprt('americanfootball_nfl')"
      >
        <img src="images/NFL.png" />
      </button>
      <button id="nhl" class="tree" onclick="changesprt('icehockey_nhl')">
        <img src="images/NHL.png" />
      </button>

      <button id="wnba" class="tree" onclick="changesprt('basketball_wnba')">
        <img src="images/WNBA.png" />
      </button>
      <!--<button id="openIframeBtn">Refresh PrizePicks</button>-->
      <!--<input type="number" id="quantity" name="quantity" max="80" min="1" value="filterBY">-->

      <iframe id="myIframe" frameborder="0" width="100%" height="400"></iframe>
    </div>
    <div id="formContainer" style="display: none">
      <form id="myForm">
        <input type="text" id="inputText" placeholder="Paste Text" />
        <button type="submit">Submit</button>
      </form>
    </div>
    <button id="back" onClick="javascript:backbutton()" style="display: none">
      <span>Back</span>

      <div class="subb">

          class="sublogo"
          src="https://raw.githubusercontent.com/Liammkr/WSTBET/main/LIAMODDSWHITE.png"
          alt="LOGO"
        />
        <div class="subtextdiv">
          <p class="subtext">
            Want More Props? For Only $4.99 Per Month You Can Get Unlimited
            Props And Be Notified When New Props Are Released.
          </p>
          <button
            id="payup"
            class="subbutton"
            onmouseover="this.style.backgroundColor='#555555'"
            onmouseout="this.style.backgroundColor='rgb(99 102 241)'"
          >
            Subscribe $4.99 / Month
          </button>
        </div>
      </div>
    </div>
    <div id="notis" class="form-container"></div>
