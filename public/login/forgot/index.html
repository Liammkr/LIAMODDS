<!DOCTYPE html>
<html>
  <head>
    <title>Firebase Auth Example</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <img src="LIAMODDSWHITE.png" alt="logo" class="liamodds" />
      <h2>Forgot password</h2>

      <br />
      <input type="email" id="reset-email" placeholder="Email" />
      <br />
      <div style="width: 75%; text-align: left">
        <button class="mainbutton" id="reset-password">Reset Password</button>
      </div>
    </div>
    <script>
      // Your Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyB_ve0_tAF3TbkH_sF9i8Td7EltJf_m_e0",
        authDomain: "liamkrodds.firebaseapp.com",
        databaseURL: "https://liamkrodds-default-rtdb.firebaseio.com",
        projectId: "liamkrodds",
        storageBucket: "liamkrodds.appspot.com",
        messagingSenderId: "62124083693",
        appId: "1:62124083693:web:d8650c5ede061bc666bfe4",
        measurementId: "G-ZLSBRFXPP0",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      // Get references to the auth service
      const auth = firebase.auth();

      // Google Sign-In
      document
        .getElementById("reset-password")
        .addEventListener("click", () => {
          const email = document.getElementById("reset-email").value;
          auth
            .sendPasswordResetEmail(email)
            .then(() => {
              console.log("Password reset email sent!");
            })
            .catch((error) => {
              console.error("Error sending password reset email: ", error);
            });
        });
    </script>
  </body>
</html>
