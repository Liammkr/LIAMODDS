<!DOCTYPE html>
<html>
  <head>
    <title>Firebase Auth Example</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <img src="LIAMODDSWHITE.png" alt="logo" class="liamodds" />
      <h2>Create account</h2>
      <input type="email" id="email" placeholder="Email" />
      <br />
      <input type="password" id="password" placeholder="Password" />
      <br />
      <div style="width: 75%; text-align: left">
        <button class="mainbutton" id="sign-up">Sign up</button>
        <a
          href="/login"
          style="text-align: left; width: fit-content; color: #4286f4"
          >Login</a
        >
      </div>
      <button class="logos" id="google-sign-in">
        <img src="google.png" />Sign in with Google
      </button>
    </div>
    <script>
      // Your Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const firebaseConfig = {
        apiKey: "AIzaSyB_ve0_tAF3TbkH_sF9i8Td7EltJf_m_e0",
        authDomain: "liamkrodds.firebaseapp.com",
        databaseURL: "https://liamkrodds-default-rtdb.firebaseio.com",
        projectId: "liamkrodds",
        storageBucket: "liamkrodds.appspot.com",
        messagingSenderId: "62124083693",
        appId: "1:62124083693:web:d8650c5ede061bc666bfe4",
        measurementId: "G-ZLSBRFXPP0",
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);

      // Get references to the auth service
      const auth = firebase.auth();

      // Google Sign-In
      const googleSignInButton = document.getElementById("google-sign-in");
      googleSignInButton.addEventListener("click", () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth
          .signInWithPopup(provider)
          .then((result) => {
            console.log(`User signed in: ${result.user.displayName}`);
          })
          .catch((error) => {
            console.error("Error signing in: ", error);
          });
      });
      // Email/Password Sign-Up
      const signUpButton = document.getElementById("sign-up");
      signUpButton.addEventListener("click", () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        auth
          .createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            console.log(`User signed up: ${userCredential.user.email}`);
          })
          .catch((error) => {
            console.error("Error signing up: ", error);
          });
      });
    </script>
  </body>
</html>
