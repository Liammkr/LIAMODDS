<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Card with Image</title>
    <link rel="stylesheet" href="emailcss.css" />
  </head>
  <body>
    <div class="container2">
      <img
        src="https://raw.githubusercontent.com/Liammkr/WSTBET/main/LIAMODDSWHITE.png"
        alt="Your Image"
        class="img2"
      />
    </div>
    <div class="container">
      <div class="card">
        <img
          src="https://static.prizepicks.com/images/players/mlb/Jose_Siri_131182ce-81e4-410b-aaba-4a4fc6b7676b.webp"
          alt="Jose Siri"
        />
        <div class="info">
          <div class="player-info">
            <div>Jose Siri</div>
          </div>
          <div class="points">0.5 <span>Total Bases</span></div>
          <div class="buttons">
            <button class="less">LESS</button>
            <button class="right">MORE 52.42%</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
