<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No-Vig Calculator</title>
    <style>
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        align-items: center;
      }
      .input-field {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .output-field {
        padding: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <script>
      const h = (e) => (e < 0 ? (-1 * e) / (-1 * e + 100) : 100 / (e + 100));
      const u = (e) =>
        e <= 0.5 ? ((1 - e) / e) * 100 : -((e / (1 - e)) * 100);

      function novig(odd1, odd2) {
        const americanOdds1 = isNaN(odd1) ? 0 : parseFloat(odd1);
        const americanOdds2 = isNaN(odd2) ? 0 : parseFloat(odd2);

        const odds1Percentage = h(americanOdds1);
        const odds2Percentage = h(americanOdds2);

        const totalPercentage = odds1Percentage + odds2Percentage;

        const noVigPercentage1 = (odds1Percentage / totalPercentage) * 100;

        return noVigPercentage1.toFixed(2);
      }
      var b;
      function a(url) {
        fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
          .then((response) => {
            if (response.ok) return response.json();
            throw new Error("Network response was not ok.");
          })
          .then((data) => console.log(JSON.parse(data.contents)));
      }
    </script>
  </body>
</html>
